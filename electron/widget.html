<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradox quick widget</title>
  <style>
    :root { color-scheme: dark; --bg: rgba(24, 27, 24, .96); --line: rgba(201,243,107,.18); --text: #f0f1eb; --muted: #899289; --lime: #c9f36b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: var(--text); }
    body { padding: 10px; -webkit-app-region: drag; }
    button { -webkit-app-region: no-drag; font: inherit; cursor: pointer; }
    .widget { height: 100%; padding: 17px 17px 14px; border: 1px solid var(--line); border-radius: 17px; background: linear-gradient(140deg, rgba(32,38,29,.98), var(--bg)); box-shadow: 0 18px 45px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06); }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 8px; font: 800 11px/1 system-ui, sans-serif; letter-spacing: .16em; }
    .mark { width: 16px; height: 17px; display: flex; align-items: end; gap: 2px; transform: skew(-18deg); }
    .mark i { display: block; width: 4px; border-radius: 3px; background: var(--lime); }.mark i:nth-child(1) { height: 9px; opacity: .6; }.mark i:nth-child(2) { height: 16px; }.mark i:nth-child(3) { height: 12px; opacity: .8; }
    .window-actions { display: flex; gap: 4px; }.window-actions button { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 17px; line-height: 20px; }.window-actions button:hover { color: var(--text); background: rgba(255,255,255,.08); }
    .status { display: flex; align-items: center; gap: 7px; margin: 17px 0 7px; color: var(--muted); font-size: 10px; }.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(201,243,107,.08); }
    h1 { font: 700 17px/1.15 system-ui, sans-serif; letter-spacing: -.04em; margin: 0; } .hint { color: var(--muted); font-size: 10px; margin: 5px 0 14px; }
    .actions { display: flex; gap: 8px; }.actions button { height: 34px; border-radius: 8px; font-size: 10px; font-weight: 700; }.record { flex: 1; border: 0; color: #17200d; background: var(--lime); }.record:hover { background: #d7fb7b; }.open { padding: 0 12px; color: #c5cdc1; border: 1px solid #3b4639; background: transparent; }.open:hover { border-color: #64725e; }
    .footer { color: #5f6e5a; font-size: 9px; margin-top: 10px; }.footer kbd { color: #94a77a; border: 1px solid #44513c; padding: 2px 4px; border-radius: 4px; font-size: 8px; }
  </style>
</head>
<body>
  <section class="widget">
    <div class="top">
      <div class="brand"><span class="mark"><i></i><i></i><i></i></span> PARADOX</div>
      <div class="window-actions"><button id="minimize" aria-label="Hide widget">−</button><button id="close" aria-label="Hide widget">×</button></div>
    </div>
    <div class="status"><span class="status-dot"></span> READY TO CAPTURE</div>
    <h1>Have a thought?</h1>
    <p class="hint">Start a quick dictation without opening the full app.</p>
    <div class="actions"><button class="record" id="record">Start dictating</button><button class="open" id="open">Open app</button></div>
    <div class="footer">Toggle widget anytime with <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Space</kbd></div>
  </section>
  <script>
    const api = window.paradoxWidget;
    document.getElementById('record').addEventListener('click', () => { api.startRecording(); document.querySelector('.status').innerHTML = '<span class="status-dot"></span> OPENING PARADOX'; });
    document.getElementById('open').addEventListener('click', api.showMain);
    document.getElementById('minimize').addEventListener('click', api.close);
    document.getElementById('close').addEventListener('click', api.close);
  </script>
</body>
</html>
